<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYB3RLUCSXW7.EXE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CHUVA DE CÓDIGO (MATRIX) -->
  <canvas id="rain"></canvas>

  <!-- SEQUÊNCIA DE BOOT -->
  <div id="boot">
    <div id="boot-lines"></div>
  </div>

  <!-- APLICAÇÃO PRINCIPAL -->
  <div id="app">
    
    <!-- CABEÇALHO -->
    <header>
      <div class="header-title">CYB3RLUCSXW7.EXE</div>
      <nav id="nav"></nav>
    </header>

    <!-- DIGITAÇÃO HERO -->
    <div class="hero-box">
      <span class="hero-prompt">&gt;</span><span id="hero-text"></span><span class="hero-cursor">_</span>
    </div>

    <!-- SEÇÃO HOME (LISTA DE POSTS) -->
    <main id="home">
      <div class="post-list-header">
        lucsxw7@matrix:~/posts$ ls -la<br>
        <span class="dim">total <span id="post-count">0</span></span>
      </div>
      <div id="post-list"></div>
    </main>

    <!-- SEÇÃO DE POST INDIVIDUAL -->
    <section id="post" class="hidden">
      <div class="post-meta">
        <span class="dim">cat /home/lucsxw7/posts/</span><span id="post-file" class="boot-title"></span><br>
        <span id="post-title" class="post-title-single"></span><br>
        <span class="dim">Data: </span><span id="post-date"></span> | <span class="dim">Tamanho: </span><span id="post-size"></span> bytes
      </div>
      <div id="post-body" class="post-content"></div>
      <button id="post-back" class="btn-back">&lt; VOLTAR</button>
    </section>

    <!-- SEÇÃO SHELL INTERATIVO -->
    <section id="shell" class="hidden">
      <div id="shell-history"></div>
      <div class="shell-input-container">
        <span class="shell-prompt">lucsxw7@matrix:~$</span>
        <input type="text" id="shell-input" autocomplete="off" autofocus>
      </div>
    </section>

  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
